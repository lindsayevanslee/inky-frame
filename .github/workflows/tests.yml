name: belcourt tests

# Runs the Belcourt spider/image-generator tests (belcourt/tests/) on pull
# requests that touch belcourt/, so a change is checked before it merges. The daily run (actions.yml) runs the same tests before scraping.
#
# The tests are offline: they parse small inline HTML snippets and run
# belcourt_generate_image.py in a temp directory. The real saved pages in
# belcourt/test_data/ are gitignored, so that test is skipped here.

on:
  pull_request:
    paths:
      - 'belcourt/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  # No push trigger: it would run a second time for every push to a PR
  # branch. main gets daily bot commits, which actions.yml already tests.
  workflow_dispatch: # manual run from the Actions tab

# If a branch gets a new push while its tests are still running, cancel the
# older run; only the latest commit's result matters.
concurrency:
  group: belcourt-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # tests only read the repo; they never push

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout repo content
        uses: actions/checkout@v6

      # Same setup as the daily run (actions.yml), so tests use the exact
      # Scrapy / Pillow / Twisted / w3lib versions pinned in uv.lock.
      - name: setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: install dependencies
        run: uv sync --locked

      - name: run belcourt tests
        run: uv run python -m unittest discover -s belcourt/tests -v
