name: run belcourt spider

on:
  # Scheduling moved to cron-job.org, which fires an HTTP request to GitHub's
  # workflow_dispatch API at a precise time. GitHub's native `schedule:` cron
  # runs best-effort and is frequently delayed (often 30+ min, worse near the
  # top of the hour), so an external trigger gives us reliable on-time runs.
  # cron-job.org also honors a timezone, so we get 5:07am Central year-round
  # with no DST drift. The old GitHub cron is kept below for easy restore.
  #
  # schedule:
  #   # 10:07 UTC = ~5:07am Central (CDT). Best-effort / often delayed.
  #   - cron: '7 10 * * *'
  workflow_dispatch: # manual trigger + cron-job.org external trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v6 # checkout the repository content to github runner

      - name: setup uv
        # Installs uv and Python 3.11 (from requires-python in pyproject.toml).
        # enable-cache keeps downloaded wheels between runs, keyed on uv.lock.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: install dependencies
        # --locked: install exactly what uv.lock says, and fail if uv.lock is
        # out of date with pyproject.toml instead of quietly re-resolving.
        # Only the belcourt runtime deps; the nashvillemta group is skipped.
        run: uv sync --locked

      - name: run belcourt tests
        # Offline tests of the spider's parsing and the image generator (no
        # network; they use small inline HTML snippets). Running them before
        # the spider means a broken generator stops the run here, so the frame
        # keeps yesterday's image instead of a bad commit landing on main.
        # Same tests run on pull requests via tests.yml.
        run: uv run python -m unittest discover -s belcourt/tests -v

      - name: execute spider script # run showtimes.py
        run: |
          cd belcourt/belcourt/spiders
          # CLOSESPIDER_ERRORCOUNT=1 makes scrapy exit non-zero if anything is
          # logged at ERROR/CRITICAL (e.g. the Twisted ImportError), so a broken
          # crawl fails the build instead of silently committing stale output.
          uv run scrapy runspider showtimes.py -O ../../output_showtimes.json \
            --set=CLOSESPIDER_ERRORCOUNT=1

      - name: generate jpg # run belcourt_generate_image.py
        run: |
          cd belcourt
          uv run python belcourt_generate_image.py
          
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Ran belcourt spider" --allow-empty)
          
      - name: push changes
        uses: ad-m/github-push-action@v1.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main 